<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050b1b">
<title>Airbus | Sistemas de control de vuelo</title>

<style>
:root {
  --bg: #050916;
  --blue: #168cff;
  --cyan: #62d7ff;
  --white: #f4f8ff;
  --muted: #a9bdd9;
  --line: rgba(92,181,255,.38);
  --panel-border: rgba(69,168,255,.48);
  --panel-glow: rgba(0,117,255,.16);
  --panel-top: rgba(19,61,125,.82);
  --panel-bottom: rgba(3,13,35,.96);
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  color: var(--white);
  font-family: "Segoe UI", Arial, sans-serif;
  background:
    radial-gradient(ellipse at 18% 45%,rgba(0,91,214,.22),transparent 42%),
    radial-gradient(ellipse at 83% 18%,rgba(0,174,255,.12),transparent 34%),
    linear-gradient(135deg,#030712 0%,#07142c 55%,#020611 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .16;
  background-image:
    linear-gradient(rgba(81,160,255,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(81,160,255,.10) 1px,transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(to bottom,black,transparent 95%);
}

body::after {
  content: "";
  position: fixed;
  width: 42vw;
  height: 42vw;
  min-width: 300px;
  min-height: 300px;
  left: -15vw;
  bottom: -27vw;
  border-radius: 50%;
  background: rgba(0,106,255,.13);
  filter: blur(85px);
  pointer-events: none;
  animation: ambient 9s ease-in-out infinite alternate;
}

@keyframes ambient {
  from {
    transform: translate(0,0) scale(.9);
    opacity: .55;
  }
  to {
    transform: translate(9vw,-5vh) scale(1.15);
    opacity: 1;
  }
}

.app {
  position: relative;
  width: 100%;
  height: 100%;
  isolation: isolate;
}

.topbar {
  position: absolute;
  z-index: 5;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  padding: 0 3.2vw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(116,190,255,.13);
  background: linear-gradient(90deg,rgba(3,9,22,.84),rgba(5,16,38,.46));
  backdrop-filter: blur(12px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #eaf5ff;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.brand-mark {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 13px var(--cyan);
}

.top-hint {
  color: #8fa9ca;
  font-size: 11px;
  letter-spacing: .08em;
}

.stage {
  position: absolute;
  inset: 54px 0 48px;
  display: grid;
  place-items: center;
  padding: clamp(20px,3vw,46px);
}

.slide {
  position: absolute;
  width: min(1560px,100%);
  height: 100%;
  max-height: 960px;
  display: none;
  overflow: hidden;
  padding: clamp(20px,3vw,46px);
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.slide.active {
  display: flex;
  flex-direction: column;
  animation: slideIn .45s ease both;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(10px) scale(.994);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

h1,h2,h3,p {
  margin-top: 0;
}

h1,h2,h3 {
  font-family: "Segoe UI", Arial, sans-serif;
}

h1 {
  margin-bottom: 12px;
  font-size: clamp(34px,4.6vw,68px);
  line-height: 1.02;
  letter-spacing: -.045em;
  font-weight: 800;
}

h2 {
  margin-bottom: 10px;
  font-size: clamp(27px,3.4vw,50px);
  line-height: 1.08;
  letter-spacing: -.035em;
}

h3 {
  margin-bottom: 8px;
  color: #eaf5ff;
  font-size: clamp(15px,1.5vw,20px);
}

.slide-kicker {
  color: var(--cyan);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .22em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.subtitle {
  color: #b8cce7;
  font-size: clamp(13px,1.25vw,17px);
  line-height: 1.5;
}

.accent {
  color: var(--cyan);
}

.muted {
  color: var(--muted);
}

.content-area {
  flex: 1;
  min-height: 0;
  display: grid;
  gap: clamp(12px,1.5vw,22px);
}

.two-col {
  grid-template-columns: minmax(0,1fr) minmax(0,1.12fr);
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
}

.fill {
  flex: 1;
  min-height: 0;
}

/* ESTILO UNIFICADO DE LOS RECUADROS */

.slot,
.data-card,
.intermediate-title,
.visual-slot,
.meta-item {
  position: relative;
  border: 1px solid var(--panel-border);
  border-radius: 15px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(0,133,255,.20), transparent 68%),
    linear-gradient(145deg, var(--panel-top), var(--panel-bottom));
  box-shadow:
    inset 0 1px 0 rgba(190,225,255,.12),
    inset 0 0 34px rgba(0,105,255,.10),
    0 9px 26px rgba(0,0,0,.30),
    0 0 20px var(--panel-glow);
}

.slot::after,
.data-card::after,
.intermediate-title::after,
.visual-slot::after,
.meta-item::after {
  content: "";
  position: absolute;
  width: 125px;
  height: 125px;
  top: -82px;
  right: -75px;
  border-radius: 50%;
  background: rgba(0,153,255,.17);
  filter: blur(25px);
  pointer-events: none;
}

.slot {
  position: relative;
  min-width: 0;
  min-height: 110px;
  height: 100%;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #c1ddfa;
  text-align: center;
  padding: clamp(16px,2vw,28px);
  background:
    radial-gradient(ellipse at 50% 42%, rgba(0,113,255,.24), rgba(2,9,24,.84) 75%),
    linear-gradient(145deg, #102c5a, #030d25);
  border-color: rgba(69,168,255,.48);
  box-shadow:
    inset 0 0 38px rgba(0,115,255,.14),
    inset 0 1px rgba(210,235,255,.10),
    0 9px 26px rgba(0,0,0,.30),
    0 0 22px rgba(0,117,255,.13);
  overflow: hidden;
}

.slot-label {
  position: relative;
  z-index: 1;
  color: #a9d4ff;
  font-size: 9px;
  letter-spacing: .16em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.slot-hint {
  position: relative;
  z-index: 1;
  color: #e0efff;
  font-size: 11px;
  letter-spacing: .08em;
  line-height: 1.5;
}

/* MODELOS 3D */

.model-slot {
  position: relative;
  flex: 1;
  min-height: 260px;
  height: 100%;
  border: 1px solid rgba(69,168,255,.52);
  border-radius: 16px;
  overflow: hidden;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 42%, rgba(0,113,255,.34), rgba(2,9,24,.90) 72%),
    linear-gradient(145deg, #102c5a, #030d25);
  box-shadow:
    inset 0 0 48px rgba(0,115,255,.18),
    inset 0 1px rgba(210,235,255,.10),
    0 10px 30px rgba(0,0,0,.34),
    0 0 25px rgba(0,117,255,.16);
}

.model-slot .slot {
  width: calc(100% - 26px);
  height: calc(100% - 46px);
  min-height: 190px;
  border: 1px solid rgba(91,178,255,.24);
  border-radius: 12px;
  background: rgba(2,12,29,.24);
  box-shadow: inset 0 0 25px rgba(0,115,255,.08);
}

.model-caption {
  position: absolute;
  bottom: 13px;
  left: 17px;
  color: #83b9e8;
  font-size: 9px;
  letter-spacing: .16em;
}

.cover {
  justify-content: center;
}

.cover-layout {
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  gap: clamp(22px,4vw,64px);
  align-items: stretch;
  height: 100%;
}

.cover-copy {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
}

.airbus-logo-area {
  margin-bottom: 22px;
  min-height: 58px;
  display: flex;
  align-items: center;
}

/* PORTADA AIRBUS */

.slide.cover {
  justify-content: center;
  align-items: center;
}

.airbus-wordmark {
  width: 100%;
  text-align: center;

  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 1000;
  font-size: clamp(75px, 15vw, 210px);
  letter-spacing: -0.065em;
  line-height: 1;

  transform: scaleX(1.08);

  text-shadow:
    0 0 8px rgba(255,255,255,.65),
    0 0 20px rgba(100,190,255,.65),
    0 0 45px rgba(40,145,255,.55),
    0 0 85px rgba(0,110,255,.4);

  animation: airbusGlow 3s ease-in-out infinite alternate;
}

@keyframes airbusGlow {

  from {
    text-shadow:
      0 0 5px rgba(255,255,255,.45),
      0 0 15px rgba(100,190,255,.4),
      0 0 35px rgba(40,145,255,.3);
  }

  to {
    text-shadow:
      0 0 12px rgba(255,255,255,.95),
      0 0 28px rgba(100,190,255,.9),
      0 0 55px rgba(40,145,255,.75),
      0 0 100px rgba(0,110,255,.6);
  }

}

.cover-rule {
  width: 76px;
  height: 3px;
  background: var(--cyan);
  box-shadow: 0 0 15px var(--blue);
  margin: 22px 0;
}

.cover-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 20px;
}

.meta-item {
  padding: 13px 15px;
  overflow: hidden;
}

.meta-item span {
  display: block;
  position: relative;
  z-index: 1;
  color: #a9d4ff;
  font-size: 9px;
  letter-spacing: .13em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.meta-item strong {
  position: relative;
  z-index: 1;
  font-size: 13px;
  font-weight: 650;
  color: #f4f8ff;
}

/* DIAPOSITIVAS INTERMEDIAS */

.intermediate-layout {
  flex: 1;
  min-height: 0;
  display: grid;
  gap: clamp(14px, 2vw, 28px);
}

.intermediate-title {
  min-width: 0;
  padding: 14px 17px;
  overflow: hidden;
}

.intermediate-title h2 {
  position: relative;
  z-index: 1;
  margin: 0 0 5px;
  color: #f4f8ff;
  font-size: clamp(17px, 1.7vw, 24px);
  line-height: 1.15;
  letter-spacing: 0;
}

.intermediate-title p {
  position: relative;
  z-index: 1;
  margin: 0;
  color: #b8d4f2;
  font-size: clamp(11px, 1vw, 14px);
}

.intermediate-data {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: clamp(10px, 1.5vw, 18px);
  min-height: 0;
}

.data-card {
  min-width: 0;
  min-height: 0;
  padding: 11px 14px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
  color: #f4f8ff;
}

.data-card h3 {
  position: relative;
  z-index: 1;
  margin: 0 0 4px;
  color: #a9d4ff;
  font-size: clamp(13px, 1.2vw, 17px);
  font-weight: 600;
}

.data-card p {
  position: relative;
  z-index: 1;
  margin: 0;
  color: #e0efff;
  font-size: clamp(11px, 1vw, 14px);
  line-height: 1.4;
}

.visual-slot {
  position: relative;
  min-width: 0;
  min-height: 0;
  height: 100%;
  overflow: hidden;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse at 50% 42%, rgba(0,113,255,.30), rgba(2,9,24,.88) 72%),
    linear-gradient(145deg, #102c5a, #030d25);
}

.visual-slot .slot {
  width: 100%;
  height: 100%;
  min-height: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.visual-slot img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.visual-slot .slot-label {
  font-size: 12px;
  color: #a9d4ff;
}

.visual-slot .slot-hint {
  font-size: clamp(13px, 1.4vw, 19px);
  color: #e0efff;
}

.intermediate-model {
  min-height: 0;
  height: 100%;
}

.intermediate-model .slot {
  width: 100%;
  height: 100%;
  min-height: 0;
  border: 1px solid rgba(91,178,255,.24);
  border-radius: 12px;
  background: rgba(2,12,29,.24);
}

/* DISTRIBUCIÓN DE LAS SEIS PLANTILLAS */

.layout-1 .intermediate-layout {
  grid-template-columns: 1fr 1fr;
}

.layout-1 .left-column {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: clamp(14px, 2vw, 24px);
  min-height: 0;
}

.layout-2 .intermediate-layout {
  grid-template-columns: 1fr 1fr;
}

.layout-2 .right-column {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: clamp(14px, 2vw, 24px);
  min-height: 0;
}

.layout-3 .intermediate-layout {
  grid-template-columns: 1.05fr .95fr;
}

.layout-3 .left-column {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 12px;
  min-height: 0;
}

.layout-3 .intermediate-data {
  grid-template-columns: 1fr;
  grid-template-rows: repeat(4, minmax(0, 1fr));
}

.layout-4 .intermediate-layout {
  grid-template-columns: .85fr 1.15fr;
}

.layout-4 .left-column {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 14px;
  min-height: 0;
}

.layout-5 .intermediate-layout {
  grid-template-columns: .85fr 1.15fr;
}

.layout-5 .left-column {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 14px;
  min-height: 0;
}

.layout-6 .intermediate-layout {
  grid-template-columns: 1fr 1fr;
}

.layout-6 .left-column {
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 14px;
  min-height: 0;
}

.layout-6 .intermediate-data {
  grid-template-columns: 1fr;
  grid-template-rows: repeat(3, minmax(0, 1fr));
}

/* EFECTOS */

.data-card:hover,
.intermediate-title:hover,
.meta-item:hover,
.slot:hover,
.visual-slot:hover {
  border-color: rgba(98,215,255,.68);
  box-shadow:
    inset 0 0 42px rgba(0,115,255,.17),
    inset 0 1px rgba(220,240,255,.14),
    0 11px 30px rgba(0,0,0,.34),
    0 0 27px rgba(0,145,255,.20);
}

/* BARRA INFERIOR */

.bottombar {
  position: absolute;
  z-index: 5;
  bottom: 0;
  left: 0;
  right: 0;
  height: 48px;
  padding: 0 3.2vw;
  display: flex;
  align-items: center;
  gap: 16px;
  background: rgba(2,7,18,.82);
  border-top: 1px solid rgba(116,190,255,.13);
  backdrop-filter: blur(12px);
}

.progress-track {
  height: 3px;
  flex: 1;
  background: rgba(123,165,211,.18);
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg,#0879ff,#6ce2ff);
  box-shadow: 0 0 12px #168cff;
  transition: width .3s ease;
}

.counter {
  min-width: 104px;
  color: #a9c4e4;
  font-size: 11px;
  letter-spacing: .08em;
  text-align: right;
}

.nav-btn {
  border: 1px solid rgba(109,183,255,.25);
  color: #d9edff;
  background: rgba(17,48,89,.55);
  border-radius: 9px;
  padding: 7px 12px;
  cursor: pointer;
  font-size: 12px;
}

.nav-btn:hover {
  background: rgba(22,112,207,.35);
  border-color: var(--cyan);
}

.nav-btn:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

/* ADAPTACIÓN A PANTALLAS PEQUEÑAS */

@media (max-width:760px) {

  .topbar {
    height: 46px;
  }

  .stage {
    inset: 46px 0 46px;
    padding: 7px;
  }

 .slide {
  position: absolute;
  width: 100%;
  height: 100%;
  max-height: 960px;
  display: none;
  overflow: hidden;
  padding: clamp(20px,3vw,46px);
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

  .cover-layout {
    grid-template-columns: 1fr;
    gap: 18px;
    align-content: start;
  }

  .cover-copy {
    justify-content: flex-start;
  }

  .cover .model-slot {
    min-height: 190px;
  }

  .intermediate-layout,
  .layout-1 .intermediate-layout,
  .layout-2 .intermediate-layout,
  .layout-3 .intermediate-layout,
  .layout-4 .intermediate-layout,
  .layout-5 .intermediate-layout,
  .layout-6 .intermediate-layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto;
  }

  .layout-1 .left-column,
  .layout-2 .right-column,
  .layout-3 .left-column,
  .layout-4 .left-column,
  .layout-5 .left-column,
  .layout-6 .left-column {
    min-height: 250px;
  }

  .layout-3 .intermediate-data {
    grid-template-columns: 1fr;
    grid-template-rows: repeat(4, minmax(75px, auto));
  }

  .layout-6 .intermediate-data {
    grid-template-columns: 1fr;
    grid-template-rows: repeat(3, minmax(75px, auto));
  }

  .intermediate-data {
    grid-auto-rows: minmax(75px, auto);
  }

  .visual-slot,
  .intermediate-model {
    min-height: 210px;
  }

  .content-area,
  .two-col {
    grid-template-columns: 1fr !important;
    grid-template-rows: auto !important;
  }

  .model-slot {
    min-height: 210px;
  }

  .bottombar {
    height: 46px;
    padding: 0 9px;
    gap: 8px;
  }

  .top-hint {
    display: none;
  }

  .counter {
    min-width: 82px;
    font-size: 10px;
  }

  .nav-btn {
    padding: 6px 9px;
  }
}

@media (max-height:620px) and (min-width:761px) {

  .slide {
    padding: 18px 26px;
  }

  .model-slot {
    min-height: 190px;
  }

  .cover-meta {
    margin-top: 10px;
  }
}

.model-slot iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 15px;
}

/* VISOR 3D INTEGRADO */
.model-slot model-viewer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-height: 260px;
  background-color: transparent;
  --poster-color: transparent;
}

.model-slot .model-caption {
  z-index: 2;
  pointer-events: none;
}

/* MAYOR SEPARACIÓN ENTRE RECUADROS */

.content-area {
  gap: clamp(18px, 2vw, 28px);
}

.stack {
  gap: 20px;
}

.intermediate-layout {
  gap: clamp(22px, 2.5vw, 34px);
}

.intermediate-data {
  gap: clamp(16px, 1.8vw, 22px);
}

.layout-1 .left-column,
.layout-2 .right-column,
.layout-3 .left-column,
.layout-4 .left-column,
.layout-5 .left-column,
.layout-6 .left-column {
  gap: clamp(18px, 2vw, 26px);
}

.cover-meta {
  gap: 16px;
}

/* =====================================
   PARTICULAS LATERALES
===================================== */

/* =====================================
   PARTICULAS LATERALES
===================================== */

.particle-side {
  position: absolute;
  top: 54px;
  bottom: 48px;
  width: clamp(90px, 14vw, 190px);
  height: auto;
  pointer-events: none;
  z-index: 2;
  opacity: 1;
}

.left-particles {
  left: 0;
}

.right-particles {
  right: 0;
}

@media (max-width: 760px) {
  .particle-side {
    display: none;
  }
}

.left-particles {
  left: 0;
}

.right-particles {
  right: 0;
}

/* El contenido de la presentación queda por encima */

.stage {
  z-index: 1;
}

/* En pantallas pequeñas no mostramos los laterales */

@media (max-width: 760px) {
  .particle-side {
    display: none;
  }
}

</style>

<script type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>
</head>

<body>

<div class="app">

  <!-- EFECTO DE PARTICULAS LATERALES -->
  <canvas class="particle-side left-particles"></canvas>
  <canvas class="particle-side right-particles"></canvas>

  <header class="topbar">

    <div class="brand">
      <span class="brand-mark"></span>
      Airbus Technical Evolution
    </div>

    <div class="top-hint">

/* CREAR DIAPOSITIVAS PRINCIPALES */

function createPrincipal(title,index) {

  const section = document.createElement("section");

  section.className = "slide";
  section.dataset.kind = "principal";

  /*
    Si el título corresponde a uno de los ocho modelos Airbus,
    se crea una única sección grande para el modelo 3D.

    Las demás diapositivas principales conservan sus dos secciones.
  */

  const isAircraftModel = AIRCRAFT_MODELS.includes(title);

  let rightColumn;

 if(isAircraftModel) {

    const models3D = {
      "Airbus A310": "./modelos%203D/Airbus%20A310.glb",
      "Airbus A319": "./modelos%203D/Airbus%20A319.glb",
      "Airbus A320": "./modelos%203D/Airbus%20A320.glb",
      "Airbus A321": "./modelos%203D/Airbus%20A321.glb",
      "Airbus A330": "./modelos%203D/Airbus%20A330.glb",
      "Airbus A340": "./modelos%203D/Airbus%20A340.glb",
      "Airbus A350": "./modelos%203D/Airbus%20A350.glb",
      "Airbus A380": "./modelos%203D/Airbus%20A380.glb"
    };

    const modelPath = models3D[title];

    const model3D = modelPath
      ? `
        <model-viewer
          src="${modelPath}"
          alt="${title} en modelo tridimensional"
          camera-controls
          auto-rotate
          auto-rotate-delay="0"
          rotation-per-second="18deg"
          interaction-prompt="none"
          shadow-intensity="1"
          exposure="1"
          loading="lazy">
        </model-viewer>
      `
      : `
        <div class="slot">
          <div class="slot-label">MODELO 3D</div>
          <div class="slot-hint">
            ESPACIO RESERVADO PARA INSERTAR EL MODELO 3D
          </div>
        </div>
      `;

    rightColumn = `
      <div class="model-slot fill">
        ${model3D}
        <div class="model-caption">
          ${title.toUpperCase()} · VISTA INTERACTIVA
        </div>
      </div>
    `;

  } else {

    rightColumn = `

      <div class="model-slot fill">

        <div class="slot">

          <div class="slot-label">
            Modelo tridimensional
          </div>

          <div class="slot-hint">
            ESPACIO RESERVADO PARA INSERTAR EL MODELO 3D
          </div>

        </div>

        <div class="model-caption">
          MODELO 3D · ${title.toUpperCase()}
        </div>

      </div>

      <div class="slot" style="min-height:125px;flex:none">

        <div class="slot-label">
          Material visual complementario
        </div>

        <div class="slot-hint">
          ESPACIO PARA IMAGEN, DIAGRAMA O ESQUEMA
        </div>

      </div>

    `;

  }
const isFinalSection = [
  "Conclusiones",
  "Bibliografía",
  "Cierre / Preguntas"
].includes(title);

  if(isFinalSection) {

  section.innerHTML = `

    <div class="slide-kicker">
      Sección principal · ${String(index+1).padStart(2,"0")}
    </div>

        <div class="slot fill">

          <div class="slot-label">

          </div>

          <div class="slot-hint">
            ESPACIO PARA TEXTO, DATOS O INFORMACIÓN TÉCNICA
          </div>

      </div>

  `;

} else {

  section.innerHTML = `

    <div class="slide-kicker">
      Sección principal · ${String(index+1).padStart(2,"0")}
    </div>

/* CREAR DIAPOSITIVAS INTERMEDIAS */

function createIntermediate(sectionIndex,number,layoutIndex) {

  const layout = layouts[layoutIndex];

  const section = document.createElement("section");

  section.className = `slide ${layout.name}`;
  section.dataset.kind = "intermedio";

  section.innerHTML = layout.html;

  return section;
}

/* GENERAR TODAS LAS DIAPOSITIVAS */

for(let i=1;i<MAIN_SLIDES.length;i++) {

  // No crear slides intermedios en estos tres espacios:
  // Portada → Introducción
  // Conclusiones → Bibliografía
  // Bibliografía → Cierre / Preguntas

  const omitirIntermedios = [1, 2, 11, 12].includes(i);

  if(!omitirIntermedios) {

    for(let j=0;j<INTERMEDIATE_PER_SECTION;j++) {

      stage.appendChild(
        createIntermediate(i,j+1,j)
      );

    }

  }

  stage.appendChild(
    createPrincipal(MAIN_SLIDES[i],i)
  );

}

/* NAVEGACIÓN */

const slides = Array.from(
  document.querySelectorAll(".slide")
);

const counter = document.getElementById("counter");
const progressFill = document.getElementById("progressFill");

let slideNumber = 0;

function showSlide(index) {

  slideNumber = Math.max(
    0,
    Math.min(index,slides.length-1)
  );

  slides.forEach((slide,i)=>{

    slide.classList.toggle(
      "active",
      i===slideNumber
    );

    if(i===slideNumber) {
      slide.scrollTop = 0;
    }

  });

  counter.textContent =
    `Slide ${slideNumber+1} de ${slides.length}`;

  progressFill.style.width =
    `${((slideNumber+1)/slides.length)*100}%`;

  const heading = slides[slideNumber].querySelector("h1,h2");

  document.title =
    `${heading ? heading.textContent : "Airbus"} | ${slideNumber+1}/${slides.length}`;

}

function nextSlide() {
  showSlide(slideNumber+1);
}

function previousSlide() {
  showSlide(slideNumber-1);
}

document
  .getElementById("nextBtn")
  .addEventListener("click",nextSlide);

document
  .getElementById("prevBtn")
  .addEventListener("click",previousSlide);

/* NAVEGACIÓN POR TECLADO */

document.addEventListener("keydown",event=>{

  if(
    event.key==="ArrowRight" ||
    event.key==="PageDown" ||
    event.key===" "
  ) {

    event.preventDefault();
    nextSlide();

  } else if(
    event.key==="ArrowLeft" ||
    event.key==="PageUp"
  ) {

    event.preventDefault();
    previousSlide();

  } else if(event.key.toLowerCase()==="f") {

    event.preventDefault();
    toggleFullscreen();

  }

});

/* PANTALLA COMPLETA */

async function toggleFullscreen() {

  try {

    if(!document.fullscreenElement) {

      await document.documentElement.requestFullscreen();

    } else {

      await document.exitFullscreen();

    }

  } catch(error) {

    console.warn(
      "No se pudo cambiar el modo de pantalla completa:",
      error
    );

  }

}

/* INICIAR PRESENTACIÓN */

showSlide(0);
/* =====================================
   ANIMACION DE PARTICULAS LATERALES
===================================== */

(() => {

  const canvases = [
    {
      element: document.querySelector(".left-particles"),
      direction: 1
    },
    {
      element: document.querySelector(".right-particles"),
      direction: -1
    }
  ];

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  function createParticles(canvas, direction) {

    const ctx = canvas.getContext("2d");

    let width;
    let height;
    let particles = [];

    function resize() {

      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = rect.width;
      height = rect.height;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const amount = Math.max(
        45,
        Math.floor(width * height / 3500)
      );

      particles = [];

      for (let i = 0; i < amount; i++) {

       particles.push({
  x: Math.random() * width,

  /* Distribución a lo largo de TODO el lateral */
  y: (i / amount) * height +
     (Math.random() - 0.5) * (height / amount),

  size: Math.random() * 1.8 + 0.8,

  speed: Math.random() * 0.35 + 0.15,

  opacity: Math.random() * 0.40 + 0.30,

  phase: Math.random() * Math.PI * 2
});

      }

    }

    function draw() {

      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => {

        p.x += p.speed * direction;

        p.phase += 0.015;

        const glow =
          p.opacity * (0.75 + Math.sin(p.phase) * 0.25);

        /* Reiniciar al llegar al centro */

        if (direction === 1 && p.x > width) {
          p.x = 0;
          p.y = Math.random() * height;
        }

        if (direction === -1 && p.x < 0) {
          p.x = width;
          p.y = Math.random() * height;
        }

        /* Brillo suave */

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          p.size,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = `rgba(100,190,255,${glow})`;

        ctx.shadowBlur = 7;
        ctx.shadowColor = "rgba(40,145,255,0.45)";

        ctx.fill();

      });

      ctx.shadowBlur = 0;

      if (!reducedMotion) {
        requestAnimationFrame(draw);
      }

    }

    resize();
    draw();

    window.addEventListener("resize", resize);

  }

  canvases.forEach(item => {

    if (item.element) {
      createParticles(
        item.element,
        item.direction
      );
    }

  });

})();
